  <script>
    const $ = selector => document.querySelector(selector)
    const $form = $('form')

    document.addEventListener('DOMContentLoaded', start, false)
    $form.addEventListener('submit', event => submitForm(event), false)

    function start() {
      const params = new URLSearchParams(window.location.search)
      const id = params.get('id')
      if (id) {
        getDataItem(id, 'MOVIMIENTOS', 'items')
      }
    }

    function getDataItem(id, collectionName, items) {
      const item = getData(collectionName, items).find(obj => obj.id == id)
      if (!item) {
        return
      }

      const set = (name, value) => {
        const $input = $form.querySelector(`[name="${name}"]`)
        if ($input) {
          $input.value = value ?? ''
        }
      }
    }

    function submitForm(event) {
      event.preventDefault()
      debugger
      const formData = new FormData($form)
      const info = generateInfo(formData)
      if (!$form.checkValidity()) {
        focusFirstInputInvalid()
        return
      }
      if (!info?.id) {
        createObjective(info, 'MOVIMIENTOS', 'items')
      } else {
        updateObjective(info, 'MOVIMIENTOS', 'items')
      }
    }

    function generateInfo(formData) {
      const info = {}
      for (const [key, value] of formData.entries()) {
        info[key] = value
        info[key.toLowerCase()] = value
      }
      info.fecha_creacion = getDate()
      info.creador = 'etxu00'
      return info
    }

    function getIdItem(key, subKey) {
      const data = getData(key, subKey)
      return data.length ? Math.max(...data.map(item => item.id)) + 1 : 1
    }

    function focusFirstInputInvalid() {
      const $firstInvalid = $form.querySelectorAll('input:invalid, select:invalid, textarea:invalid')
      if ($firstInvalid.length) {
        if ($firstInvalid[0].tagName === 'INPUT' && $firstInvalid[0].value) {
          $firstInvalid[0].select()
          return
        }
        $firstInvalid[0].focus()
      }
    }

    function updateObjective(info, collectionName, items) {
      const id = info.id
      const data = getData(collectionName, items)
      const tmpData = localStorage.getItem('DATA') ? JSON.parse(localStorage.getItem('DATA')) : {}

      data[id] = info
      const DATA = { ...tmpData, [collectionName]: { [items]: data } }
      localStorage.setItem('DATA', JSON.stringify(DATA))
      window.location.href = '/movimientos.html'
    }

    function createObjective(info, collectionName, items) {
      const localData = localStorage.getItem('DATA')
      const tmpData = localData ? JSON.parse(localData) : {}
      const data = getData(collectionName, items)
      info.id = getIdItem('MOVIMIENTOS', 'items')
      data.push(info)
      const DATA = { ...tmpData, [collectionName]: { [items]: data } }
      localStorage.setItem('DATA', JSON.stringify(DATA))
      window.location.href = '/movimientos.html'
    }

    function getData(key, subKey) {
      const localData = localStorage.getItem('DATA')
      const tmpData = localData ? JSON.parse(localData) : {}
      const data = tmpData[key] ? tmpData[key][subKey] : []
      return data
    }

    function getDate() {
      const date = new Date()
      return date.toISOString()
    }
  </script>
