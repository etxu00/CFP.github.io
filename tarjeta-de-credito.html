  <style>
    label:has([required]) span::after {
      content: " *";
      color: red;
    }

    label:has(input:invalid) {
      color: red;

      input {
        border-color: red;
      }
    }

    label:has(input:not(:invalid)) .invalid {
      display: none;
    }

    img {
      max-width: 200px;
    }
  </style>

  <main>
    <form id="form">
      <input name="id" type="hidden">
      <input id="input_image" name="imagen" type="hidden">
      <input id="active" name="activo" type="hidden" value="true">
      <input name="creador" type="hidden" value="etxu00">
      <!-- GENERAL -->
      <details open>
        <summary>General</summary>
        <section>
          <label>
            <span>Nombre</span>
            <input autocomplete="off" autofocus name="nombre" placeholder="Nombre del objetivo" required>
          </label>
          <style>
            .input_image {
              display: grid;
              grid-template-columns: auto 1fr auto;
              grid-template-rows: auto auto;

              &:not(:hover) {
                button {
                  display: none;
                }
              }

              button {
                grid-column: 3 / -1;
                grid-row: 1 / 2;
              }

              label[for] {
                grid-column: 1 / 2;
                grid-row: 1 / 2;
              }

              label:not([for]) {
                grid-column: 3 / -1;
                grid-row: 2 / 3;
              }

              img {
                grid-column: 2 / -1;
                grid-row: 1 / 2;
              }

              input[type="link"] {
                grid-column: 2 / 3;
                grid-row: 2 / 3;
              }

              input[type="file"] {
                display: none;
              }
            }
          </style>
          <div class="input_image">
            <label for="input_image_link">Imagen</label>
            <img alt="Imagen del objetivo" id="preview_image"
              src="https://img.icons8.com/forma-bold-filled/24/no-image.png">
            <label>
              <span>Subir imagen</span>
              <input
                autocomplete="off"
                accept="image/*"
                id="input_preview"
                type="file"
              >
            </label>
            <input
              autocomplete="off"
              id="input_image_link"
              placeholder="Imagen desde enlace"
              type="link"
            >
            <button type="button">
              <svg viewBox="0 0 24 24">
                <use href="#icon_trash">
              </svg>
              <span>Limpiar</span>
            </button>
          </div>
          <label>
            <span>Límite de crédito</span>
            <input
              autocomplete="off"
              name="limite_de_credito"
              placeholder="$0.00"
              required
              step="1"
              type="number"
            >
            <small class="invalid">Campo obligatorio</small>
          </label>
          <label>
            <span>Día de corte</span>
            <input
              autocomplete="off"
              name="dia_corte"
              required
              type="number"
            >
            <small class="invalid">Campo obligatorio</small>
          </label>
        </section>
      </details>
      <details open>
        <summary>Variantes</summary>
        <section>
          <label>
            <span>Paypal</span>
            <input
              autocomplete="off"
              name="paypal"
              type="checkbox"
            >
          </label>
          <label>
            <span>Tarjeta digital</span>
            <input
              autocomplete="off"
              name="tarjeta_digital"
              type="checkbox"
            >
          </label>
        </section>
      </details>
    </form>

  <script>
    const $ = selector => document.querySelector(selector)
    const $form = $('form')
    const $previewImage = $('#preview_image')
    const $inputPreview = $('#input_preview')
    const $inputImage = $('#input_image')
    const $inputImageLink = $('#input_image_link')
    const CONCEPT = 'TARJETAS_DE_CRÉDITO'
    const ITEMS = 'items'

    $inputImageLink.addEventListener('input', event => {
      previewImageLink(event.target.value)
    })

    document.addEventListener('DOMContentLoaded', start, false)

    $form.addEventListener('submit', event => submitForm(event), false)

    $inputPreview.addEventListener('change', event => {
      const file = event.target.files[0]
      const reader = new FileReader()
      reader.onload = event => {
        $previewImage.src = event.target.result
        $inputImage.value = event.target.result
      }
      reader.readAsDataURL(file)
    })

    function start() {
      const params = new URLSearchParams(window.location.search)
      const id = params.get('id')
      if (id) {
        getDataItem(id, CONCEPT, ITEMS)
      }
    }

    function getDataItem(id, collectionName, items) {
      // 1. Obtenemos la información del elemento
      const item = getData(collectionName, items).find(obj => obj.id == id)
      if (!item) return

      // 2. Rellenamos el form con la información disponible
      const set = (name, value) => {
        const el = $form.querySelector(`[name="${name}"]`)
        if (el) el.value = value ?? ''
      }

      set('id', item.id)
      set('nombre', item.nombre || '')
      set('limite_de_credito', item.limite_de_credito || '')
      set('dia_corte', item.dia_corte || '')
      set('paypal', item.paypal || '')
      set('tarjeta_digital', item.tarjeta_digital || '')
      set('activo', item.activo !== undefined ? item.activo : 'true')

      const imgVal = item.imagen || ''
      if (imgVal) {
        $previewImage.src = imgVal
        $inputImage.value = imgVal
        if (!imgVal.startsWith('data:')) {
          $inputImageLink.value = imgVal
        }
      }
    }

    function submitForm(event) {
      event.preventDefault()
      const formData = new FormData($form)
      const info = generateInfo(formData)
      if (!$form.checkValidity()) {
        focusFirstInputInvalid()
        return
      }
      if (!info?.id) {
        createObjective(info, CONCEPT, ITEMS)
      } else {
        updateObjective(info, CONCEPT, ITEMS)
      }
    }

    function generateInfo(formData) {
      const info = {}
      for (const [key, value] of formData.entries()) {
        info[key] = value
        info[key.toLowerCase()] = value
      }
      info.fecha_creacion = getDate()
      info.creador = 'etxu00'
      return info
    }

    function getIdItem(key, subKey) {
      const data = getData(key, subKey)
      return data.length ? Math.max(...data.map(item => item.id)) + 1 : 1
    }

    function focusFirstInputInvalid() {
      const $firstInvalid = $form.querySelectorAll('input:invalid, select:invalid, textarea:invalid')
      if ($firstInvalid.length) {
        if ($firstInvalid[0].tagName === 'INPUT' && $firstInvalid[0].value) {
          $firstInvalid[0].select()
          return
        }
        $firstInvalid[0].focus()
      }
    }

    function updateObjective(info, collectionName, items) {
      const id = info.id
      const data = getData(collectionName, items)
      const tmpData = localStorage.getItem('DATA') ? JSON.parse(localStorage.getItem('DATA')) : {}

      data[id] = info
      const DATA = { ...tmpData, [collectionName]: { [items]: data } }
      localStorage.setItem('DATA', JSON.stringify(DATA))
      window.location.href = '/objetivos.html'
    }

    function createObjective(info, collectionName, items) {
      const localData = localStorage.getItem('DATA')
      const tmpData = localData ? JSON.parse(localData) : {}
      const data = getData(collectionName, items)
      info.id = getIdItem(CONCEPT, ITEMS)
      data.push(info)
      const DATA = { ...tmpData, [collectionName]: { [items]: data } }
      console.log(DATA)
      localStorage.setItem('DATA', JSON.stringify(DATA))
      window.location.href = '/tarjetas-de-credito.html'
    }

    function getData(key, subKey) {
      const localData = localStorage.getItem('DATA')
      const tmpData = localData ? JSON.parse(localData) : {}
      const data = tmpData[key] ? tmpData[key][subKey] : []
      return data
    }

    function getDate() {
      const date = new Date()
      return date.toISOString()
    }

    function previewImageLink(url) {
      const imgError = 'https://img.icons8.com/forma-bold-filled/24/no-image.png'
      if (!url) {
        $previewImage.src = imgError
      } else {
        // Validamos con un fetch que el enlace sea una imagen .jpg, .png, .gif, .webp
        fetch(url)
          .then(response => $previewImage.src = response.ok ? url : imgError)
          .catch(error => $previewImage.src = imgError)
      }
      // Convierte la imagen en base64 y la pinta en el input hidden
      const canvas = document.createElement('canvas')
      const ctx = canvas.getContext('2d')
      const img = new Image()
      img.onload = () => {
        canvas.width = img.width
        canvas.height = img.height
        ctx.drawImage(img, 0, 0)
        $inputImage.value = canvas.toDataURL('image/png')
      }
      img.src = url
    }
  </script>
